<div class="cal">
  <div class="bar">
    <button mat-icon-button type="button" (click)="shift(-1)" [disabled]="!canGoBack()" [attr.aria-label]="'calendar.previousMonth' | t">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <p class="hint">
      @if (!start()) {
        {{ 'calendar.selectCheckIn' | t }}
      } @else if (!end()) {
        {{ 'calendar.selectCheckOut' | t }}
      } @else {
        {{ 'calendar.selected' | t }}
        <button mat-button type="button" (click)="clear()">{{ 'calendar.clear' | t }}</button>
      }
    </p>
    <button mat-icon-button type="button" (click)="shift(1)" [disabled]="!canGoForward()" [attr.aria-label]="'calendar.nextMonth' | t">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <div class="months">
    <!-- Re-created on every month change (tracked by month), so startAt always applies. -->
    @for (m of months(); track m.getTime(); let second = $index) {
      <div class="month" [class.second]="second === 1">
        <h4>{{ formatDate(m, 'monthYear') }}</h4>
        <mat-calendar
          [headerComponent]="header"
          [startAt]="m"
          [minDate]="min()"
          [maxDate]="max()"
          [selected]="selected()"
          [dateFilter]="dateFilter()"
          [dateClass]="dateClass()"
          (selectedChange)="pick($event)"
        />
      </div>
    }
  </div>

  <p class="legend"><span class="swatch"></span> {{ 'calendar.legend' | t }}</p>
</div>
