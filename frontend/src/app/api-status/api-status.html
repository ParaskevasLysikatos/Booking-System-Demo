<mat-card class="status-card">
  <mat-card-header>
    <mat-card-title>Connectivity check</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (status() === 'checking') {
      <div class="row">
        <mat-spinner diameter="20"></mat-spinner>
        <span>Checking backend&hellip;</span>
      </div>
    }
    @if (status() === 'ok') {
      <div class="row ok">
        <mat-icon>check_circle</mat-icon>
        <span>Backend: connected</span>
      </div>
      <div class="row ok">
        <mat-icon>storage</mat-icon>
        <span>Database: {{ databaseStatus() }}</span>
      </div>
    }
    @if (status() === 'error') {
      <div class="row error">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }
  </mat-card-content>
</mat-card>
