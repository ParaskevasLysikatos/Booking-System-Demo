<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Booking System Demo</title>
  <base href="/">
  <!-- viewport-fit=cover: the page may draw under a phone's notch/home bar; the toolbar,
       footer and bottom bars pad themselves with env(safe-area-inset-*) (TICKET-031). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Browse and book apartments and rooms; admins manage listings and bookings.">

  <!-- Installable app (TICKET-031): manifest + icons, no service worker. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#efedf0">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <!-- iPhone / iPad "Add to Home Screen" -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Bookings">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
