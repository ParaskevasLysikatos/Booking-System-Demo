# Render Blueprint: the API and its database (TICKET-026) and the Angular
# site (TICKET-027), as code.
# In Render: New -> Blueprint -> pick this repo -> Apply.
# See the README's "Deploying to Render".

databases:
  - name: booking-demo-db
    plan: free              # expires 30 days after creation (Render's free-tier rule)
    region: frankfurt       # keep it next to the API
    postgresMajorVersion: "16"   # same as docker-compose
    databaseName: booking_demo
    user: booking_demo

services:
  - type: web
    name: booking-demo-api
    runtime: python
    plan: free              # sleeps after 15 min idle, ~1 min to wake up
    region: frankfurt       # closest to Greece
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    autoDeployTrigger: commit   # every push to master redeploys
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-demo-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true     # random, also signs the JWTs
      - key: DJANGO_DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"           # first deploy only, see build.sh
      - key: WEB_CONCURRENCY
        value: "2"              # gunicorn workers; the free instance has 512 MB
      - key: CORS_ALLOWED_ORIGINS
        value: https://booking-demo-g4aw.onrender.com   # the Angular site below (TICKET-027)

  # The Angular app (TICKET-027): built once per push, served from Render's CDN.
  # Static sites are free and never sleep (only the API above does).
  - type: web
    name: booking-demo          # -> https://booking-demo-g4aw.onrender.com (booking-demo.onrender.com was taken, so Render added a suffix)
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx ng build   # production config -> environment.production.ts
    staticPublishPath: dist/frontend/browser   # relative to rootDir
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"             # same as frontend/Dockerfile
    routes:
      # Single-page app: any path that isn't a real file (/listings/42,
      # /admin/bookings, ...) gets index.html and Angular's router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
