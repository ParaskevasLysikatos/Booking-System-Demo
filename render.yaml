# Render Blueprint: the API and its database (TICKET-026) and the Angular
# site (TICKET-027), as code.
# In Render: New -> Blueprint -> pick this repo -> Apply.
# See the README's "Deploying to Render".

databases:
  - name: booking-demo-db
    plan: free              # expires 30 days after creation (Render's free-tier rule)
    region: frankfurt       # keep it next to the API
    postgresMajorVersion: "16"   # same as docker-compose
    databaseName: booking_demo
    user: booking_demo

services:
  - type: web
    name: booking-demo-api
    runtime: python
    plan: free              # sleeps after 15 min idle, ~1 min to wake up
    region: frankfurt       # closest to Greece
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    autoDeployTrigger: commit   # every push to master redeploys
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-demo-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true     # random, also signs the JWTs
      - key: DJANGO_DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"           # first deploy only, see build.sh
      - key: WEB_CONCURRENCY
        value: "2"              # gunicorn workers; the free instance has 512 MB
      - key: CORS_ALLOWED_ORIGINS
        value: https://booking-demo-g4aw.onrender.com   # the Angular site below (TICKET-027)
      # Stripe test-mode payments (TICKET-029). Secrets: set in the Render
      # dashboard, never in this file. Leave STRIPE_SECRET_KEY empty and
      # payments stay off (the site works as before). See the README's
      # "Payments on Render".
      - key: STRIPE_SECRET_KEY
        sync: false             # restricted key rk_test_... (Checkout Sessions: Write + Charges and Refunds: Write)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false             # whsec_... of the Stripe webhook endpoint for this API
      - key: FRONTEND_URL
        value: https://booking-demo-g4aw.onrender.com   # where Stripe sends guests back (+ the links in emails)
      # Booking emails (TICKET-030) through the Gmail API, sent as the owner's
      # Gmail - Render's free plan blocks SMTP ports. Until the three GMAIL_*
      # values are set, emails are only printed to the log (the deploy works
      # either way). The addresses are set in the dashboard too: the repo is
      # public. See the README's "Emails on Render (Gmail API)".
      - key: EMAIL_PROVIDER
        value: gmail
      - key: GMAIL_CLIENT_ID
        sync: false             # Google Cloud OAuth client, type "Desktop app"
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false             # from `manage.py gmail_authorize` (scope gmail.send only)
      - key: DEFAULT_FROM_EMAIL
        sync: false             # Booking System Demo <you@gmail.com> - the same Gmail that authorised the API
      - key: BOOKING_ALERT_EMAILS
        sync: false             # who gets the "new booking" alert + admin accounts' booking emails
      # Backup provider (TICKET-047): when Gmail's login is dead (e.g. the
      # refresh token expired - it does every 7 days while the Google app is
      # in Testing) the email goes through Brevo instead, and the owner is
      # told once a day to run `gmail_authorize`. Without BREVO_API_KEY
      # there's no fallback (as before). See the README's "Brevo fallback
      # when the Gmail token expires".
      - key: EMAIL_FALLBACK_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false             # xkeysib-... (Brevo -> SMTP & API -> API keys); DEFAULT_FROM_EMAIL verified as a sender there
      # Photo uploads straight to the owner's S3 bucket (TICKET-036). Until
      # all four are set, uploads are off and the admin Photos editor only
      # takes pasted URLs (the deploy works either way). Keys of the
      # upload-only IAM user, never root keys. See the README's
      # "Photo uploads: setting up S3".
      - key: AWS_ACCESS_KEY_ID
        sync: false             # IAM user with only s3:PutObject + s3:DeleteObject on <bucket>/property-images/*
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false             # the bucket name
      - key: AWS_S3_REGION
        sync: false             # the bucket's region, e.g. eu-central-1

  # The Angular app (TICKET-027): built once per push, served from Render's CDN.
  # Static sites are free and never sleep (only the API above does).
  - type: web
    name: booking-demo          # -> https://booking-demo-g4aw.onrender.com (booking-demo.onrender.com was taken, so Render added a suffix)
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx ng build   # production config -> environment.production.ts
    staticPublishPath: dist/frontend/browser   # relative to rootDir
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"             # same as frontend/Dockerfile
    routes:
      # Single-page app: any path that isn't a real file (/listings/42,
      # /admin/bookings, ...) gets index.html and Angular's router takes over.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
